<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Балістичний Симулятор</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f0f0; color: #333;}
        
        #map { height: 100vh; width: 100%; z-index: 1; }

        /* ЛІВА ПАНЕЛЬ */
        .left-panel {
            position: absolute; top: 20px; left: 20px; 
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            z-index: 1001; border-radius: 8px; border: 1px solid #ccc;
            width: 240px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        /* ПРАВА ПАНЕЛЬ */
        .controls {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            z-index: 1001; border-radius: 8px; border: 1px solid #ccc;
            width: 320px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        button { 
            width: 100%; margin-bottom: 5px; padding: 8px; 
            cursor: pointer; font-weight: bold; border: 1px solid #999; border-radius: 4px;
        }
        
        select, input { 
            width: 100%; padding: 6px; margin-bottom: 8px; 
            box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px;
        }

        /* СТИЛІ NATO ЗНАЧКІВ */
        .nato-icon {
            background: rgba(0, 100, 255, 0.2); border: 2px solid #0064ff;
            color: #0064ff; text-align: center; font-weight: bold; line-height: 24px;
            background-image: 
                linear-gradient(to top right, transparent 49%, #0064ff 49%, #0064ff 51%, transparent 51%),
                linear-gradient(to bottom right, transparent 49%, #0064ff 49%, #0064ff 51%, transparent 51%);
        }
        
        .target-icon-red {
            border: 2px solid red; color: red; text-align: center;
            font-weight: bold; line-height: 24px; font-size: 18px;
            background: rgba(255, 0, 0, 0.1);
        }

        hr { border: 0; border-top: 1px solid #ddd; margin: 15px 0; }
        .stats-box { background: #f9f9f9; padding: 8px; border: 1px solid #eee; font-size: 0.85em; color: #555; margin-bottom: 10px;}
    </style>
</head>
<body>

    <div class="left-panel">
        <h3>Об'єкти (NATO)</h3>
        <p style="font-size: 0.8em; margin-bottom:5px;">Клікніть кнопку, потім на карту:</p>
        <button onclick="setMode('infantry')" style="background: #e1f5fe;">Infantry (Мехбат)</button>
        <button onclick="setMode('cannon')" style="background: #f1f8e9;">Artillery (Гармата)</button>
        <button onclick="setMode('ksp')" style="background: #f3e5f5;">CP (КСП)</button>
        <button onclick="setMode('target')" style="background: #ffebee; color: red;">TARGET (Ціль)</button>
        
        <hr>
        
        <p style="font-size: 0.85em; font-weight:bold; margin-bottom:5px;">Або введіть координати:</p>
        <select id="manType">
            <option value="infantry">Infantry (Мехбат)</option>
            <option value="cannon">Artillery (Гармата)</option>
            <option value="ksp">CP (КСП)</option>
            <option value="target">TARGET (Ціль)</option>
        </select>
        <input type="number" id="manLat" placeholder="Широта (Lat. напр 49.01)" step="0.0001">
        <input type="number" id="manLng" placeholder="Довгота (Lng. напр 31.02)" step="0.0001">
        <button onclick="addByCoords()" style="background: #2196F3; color: white; border:none;">ДОДАТИ ЗА КООРДИНАТАМИ</button>
    </div>

    <div id="map"></div>

    <div class="controls">
        <h3>Панель керування</h3>
        <div id="unit-info">Оберіть об'єкт на карті для взаємодії.</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([49.0, 31.0], 6);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17, attribution: 'OpenTopoMap'
        }).addTo(map);

        const cannons = [
        {
            "caliber_mm": 105.0,
            "max_range_m": 10675,
            "muzzle_velocity_ms": 470,
            "name": "10.5 cm leFH 18"
        },
        {
            "caliber_mm": 100.0,
            "max_range_m": 20000,
            "muzzle_velocity_ms": 900,
            "name": "100 mm field gun M1944 (BS-3)"
        },
        {
            "caliber_mm": 122.0,
            "max_range_m": 20400,
            "muzzle_velocity_ms": 806,
            "name": "122 mm gun M1931/37 (A-19)"
        },
        {
            "caliber_mm": 122.0,
            "max_range_m": 21900,
            "muzzle_velocity_ms": 690,
            "name": "122 mm howitzer 2A18 (D-30)"
        },
        {
            "caliber_mm": 121.92,
            "max_range_m": 11800,
            "muzzle_velocity_ms": 515,
            "name": "122 mm howitzer M1938 (M-30)"
        },
        {
            "caliber_mm": 130.0,
            "max_range_m": 27150,
            "muzzle_velocity_ms": 930,
            "name": "130 mm towed field gun M1954 (M-46)"
        },
        {
            "caliber_mm": 149.0,
            "max_range_m": 18200,
            "muzzle_velocity_ms": 520,
            "name": "15 cm sFH 18"
        },
        {
            "caliber_mm": 152.4,
            "max_range_m": 24000,
            "muzzle_velocity_ms": 650,
            "name": "152 mm gun-howitzer D-20"
        },
        {
            "caliber_mm": 152.4,
            "max_range_m": 24700,
            "muzzle_velocity_ms": 828,
            "name": "152 mm howitzer 2A65 Msta-B"
        },
        {
            "caliber_mm": 152.4,
            "max_range_m": 12400,
            "muzzle_velocity_ms": 508,
            "name": "152 mm howitzer M1943 (D-1)"
        },
        {
            "caliber_mm": 152.4,
            "max_range_m": 17230,
            "muzzle_velocity_ms": 655,
            "name": "152 mm howitzer-gun M1937 (ML-20)"
        },
        {
            "caliber_mm": 155.0,
            "max_range_m": 23700,
            "muzzle_velocity_ms": 853,
            "name": "155 mm gun M1 (Long Tom)"
        },
        {
            "caliber_mm": 203.2,
            "max_range_m": 18000,
            "muzzle_velocity_ms": 607,
            "name": "203 mm howitzer M1931 (B-4)"
        },
        {
            "caliber_mm": 85.0,
            "max_range_m": 15650,
            "muzzle_velocity_ms": 1030,
            "name": "85 mm divisional gun D-44"
        },
        {
            "caliber_mm": 75.0,
            "max_range_m": 11000,
            "muzzle_velocity_ms": 500,
            "name": "Canon de 75 mod\u00e8le 1897"
        },
        {
            "caliber_mm": 105.0,
            "max_range_m": 15100,
            "muzzle_velocity_ms": 494,
            "name": "M102 howitzer"
        },
        {
            "caliber_mm": 155.0,
            "max_range_m": 14600,
            "muzzle_velocity_ms": 563,
            "name": "M114 155 mm howitzer"
        },
        {
            "caliber_mm": 155.0,
            "max_range_m": 40000,
            "muzzle_velocity_ms": 684,
            "name": "M198 howitzer"
        },
        {
            "caliber_mm": 155.0,
            "max_range_m": 40000,
            "muzzle_velocity_ms": 827,
            "name": "M777 Lightweight Towed Howitzer"
        },
        {
            "caliber_mm": 87.6,
            "max_range_m": 12253,
            "muzzle_velocity_ms": 532,
            "name": "Ordnance QF 25-pounder"
        }
    ];

        var allUnits = [];
        var currentMode = null;
        var trajectoryLine = null;
        var lastSelectedCannon = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('map').style.cursor = 'crosshair';
        }

        map.on('click', function(e) {
            if (!currentMode) return;
            createUnit(currentMode, e.latlng.lat, e.latlng.lng);
            currentMode = null;
            document.getElementById('map').style.cursor = '';
        });

        // ФУНКЦІЯ: Додавання за введеними координатами з лівого вікна
        function addByCoords() {
            let type = document.getElementById('manType').value;
            let lat = parseFloat(document.getElementById('manLat').value);
            let lng = parseFloat(document.getElementById('manLng').value);
            
            if(isNaN(lat) || isNaN(lng)) {
                alert("Введіть коректні числові координати!"); return;
            }
            createUnit(type, lat, lng);
            map.setView([lat, lng], 10); // Відцентрувати карту на новій точці
        }

        function createUnit(type, lat, lng) {
            let iconClass = 'nato-icon';
            let iconHtml = '';

            if (type === 'infantry') iconHtml = ''; 
            else if (type === 'cannon') iconHtml = '●';
            else if (type === 'ksp') iconHtml = '||';
            else if (type === 'target') {
                iconHtml = '✖';
                iconClass = 'target-icon-red';
            }

            let myIcon = L.divIcon({ className: iconClass, iconSize: [36, 24], html: iconHtml });
            let marker = L.marker([lat, lng], {icon: myIcon}).addTo(map);
            
            let unitData = { id: Date.now(), type: type, lat: lat, lng: lng, marker: marker };

            marker.on('click', function() {
                showInfoInRightPanel(unitData);
            });

            allUnits.push(unitData);
            
            // Якщо ми поставили нову ціль і наразі відкрита гармата, оновлюємо праву панель, щоб ціль з'явилася в списку
            if (lastSelectedCannon && document.getElementById('targetSelect')) {
                showInfoInRightPanel(lastSelectedCannon);
            }
        }

        // ФУНКЦІЯ: Видалення юніта
        function deleteUnit(id) {
            let index = allUnits.findIndex(u => u.id === id);
            if(index > -1) {
                map.removeLayer(allUnits[index].marker);
                allUnits.splice(index, 1);
                document.getElementById('unit-info').innerHTML = "Оберіть об'єкт на карті.";
                if(trajectoryLine) map.removeLayer(trajectoryLine);
                lastSelectedCannon = null;
            }
        }

        // Оновлення характеристик гармати у правій панелі
        window.updateRightCannonStats = function() {
            let select = document.getElementById('cannonSelect');
            if(!select) return;
            let c = cannons[select.value];
            document.getElementById('rightCannonStats').innerHTML = 
                `<b>Калібр:</b> ${c.caliber_mm} мм<br><b>Поч. швидкість:</b> ${c.muzzle_velocity_ms} м/с<br><b>Макс. дальність:</b> ${c.max_range_m} м`;
        };

        // ВІДОБРАЖЕННЯ ПРАВОЇ ПАНЕЛІ
        function showInfoInRightPanel(unit) {
            let panel = document.getElementById('unit-info');
            
            if (unit.type === 'cannon') {
                lastSelectedCannon = unit;
                
                let options = cannons.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
                
                // Збираємо всі цілі на карті у випадаючий список
                let targets = allUnits.filter(u => u.type === 'target');
                let targetOptions = targets.map(t => `<option value="${t.id}">Ціль (Lat:${t.lat.toFixed(2)}, Lng:${t.lng.toFixed(2)})</option>`).join('');
                let targetHTML = targets.length > 0 
                    ? `<select id="targetSelect">${targetOptions}</select>`
                    : `<p style="color:red; font-size:0.85em;">Спочатку додайте TARGET на карту (зліва)!</p>`;

                panel.innerHTML = `
                    <h4 style="color:#e65100; margin-top:0;">АРТИЛЕРІЙСЬКА ПОЗИЦІЯ</h4>
                    <p style="font-size:0.9em; margin-bottom:5px;"><b>Ваші координати:</b> ${unit.lat.toFixed(5)}, ${unit.lng.toFixed(5)}</p>
                    
                    <label style="font-size:0.85em;">Модель гармати:</label>
                    <select id="cannonSelect" onchange="updateRightCannonStats()">${options}</select>
                    <div id="rightCannonStats" class="stats-box"></div>
                    
                    <hr>
                    <label style="font-size:0.85em;">Виберіть Ціль для стрільби:</label>
                    ${targetHTML}
                    
                    <button onclick="fireProcess()" style="background:#d32f2f; color:white; border:none;">🔥 ЗДІЙСНИТИ ПОСТРІЛ</button>
                    
                    <div id="fireResult" style="margin-top: 15px; font-weight: bold; font-size: 0.9em;"></div>
                    
                    <hr>
                    <button onclick="deleteUnit(${unit.id})" style="background: #e0e0e0; color: #333; border: none;">🗑 Прибрати цю гармату</button>
                `;
                updateRightCannonStats(); // Заповнюємо статами одразу при відкритті
            } else {
                panel.innerHTML = `
                    <h4 style="margin-top:0;">ОБ'ЄКТ: ${unit.type.toUpperCase()}</h4>
                    <p><b>Координати:</b> ${unit.lat.toFixed(5)}, ${unit.lng.toFixed(5)}</p>
                    <hr>
                    <button onclick="deleteUnit(${unit.id})" style="background: #e0e0e0; color: #333; border: none;">🗑 Прибрати з карти</button>
                `;
            }
        }

        async function fireProcess() {
            if (!lastSelectedCannon) return;
            
            let targetSelect = document.getElementById('targetSelect');
            if (!targetSelect) { alert("Немає цілі для пострілу!"); return; }
            
            // Знаходимо вибрану ціль по ID
            let targetId = parseInt(targetSelect.value);
            let target = allUnits.find(u => u.id === targetId);
            if (!target) return;

            let cannonCfg = cannons[document.getElementById('cannonSelect').value];
            
            let data = {
                cannon_lat: lastSelectedCannon.lat, cannon_lng: lastSelectedCannon.lng,
                target_lat: target.lat, target_lng: target.lng,
                velocity: cannonCfg.muzzle_velocity_ms, max_range: cannonCfg.max_range_m
            };

            let resultDiv = document.getElementById('fireResult');
            resultDiv.style.color = '#333';
            resultDiv.innerText = "Рахуємо траєкторію...";

            try {
                const response = await fetch('/calculate_shot', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    resultDiv.style.color = 'green';
                    resultDiv.innerHTML = `✅ ВЛУЧАННЯ МОЖЛИВЕ<br><br>Відстань: ${result.distance} м<br>Азимут: ${result.azimuth}°<br>Кут підйому: ${result.elevation}°`;
                    drawTrajectory(lastSelectedCannon, target);
                } else { 
                    resultDiv.style.color = 'red';
                    resultDiv.innerHTML = `❌ ПОМИЛКА<br>${result.message}`; 
                }
            } catch (error) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = "Помилка зв'язку з Python-сервером.";
            }
        }

        function drawTrajectory(start, end) {
            if (trajectoryLine) map.removeLayer(trajectoryLine);
            var curveCoords = getCurvePoints(start.lat, start.lng, end.lat, end.lng);
            trajectoryLine = L.polyline(curveCoords, {color: 'red', weight: 3, dashArray: '5, 8'}).addTo(map);
            map.fitBounds(trajectoryLine.getBounds());
        }

        // ФУНКЦІЯ: Дуга завжди вигнута ВГОРУ (на Північ)
        function getCurvePoints(lat1, lng1, lat2, lng2) {
            var points = [];
            // Рахуємо умовну відстань між точками, щоб дуга була пропорційною
            var dLat = lat2 - lat1;
            var dLng = lng2 - lng1;
            var distance = Math.sqrt(dLat*dLat + dLng*dLng);
            
            // СЕКРЕТ ВИГИНУ ВГОРУ: Ми завжди ДОДАЄМО до широти (Latitude), що тягне криву на північ.
            var cpLat = (lat1 + lat2)/2 + (distance * 0.25); 
            var cpLng = (lng1 + lng2)/2; 
            
            for (var t = 0; t <= 1; t += 0.05) {
                var lat = (1-t)*(1-t)*lat1 + 2*(1-t)*t*cpLat + t*t*lat2;
                var lng = (1-t)*(1-t)*lng1 + 2*(1-t)*t*cpLng + t*t*lng2;
                points.push([lat, lng]);
            }
            return points;
        }
    </script>
</body>
</html>
