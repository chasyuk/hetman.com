services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Syncs your code so hot-reload works!
    environment:
      - WATCHFILES_FORCE_POLLING=true # Helps reload on Windows/WSL

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Essential for React hot-reload in Docker
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
