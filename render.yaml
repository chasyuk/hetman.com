services:
  # Backend — FastAPI
  - type: web
    name: hetman-backend
    runtime: docker
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "300"

  # Frontend — Vite static build
  - type: web
    name: hetman-frontend
    runtime: docker
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hetman-backend
          envVarKey: RENDER_EXTERNAL_URL
