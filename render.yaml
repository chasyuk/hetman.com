services:
  # Налаштування Backend
  - type: web
    name: backend-service
    runtime: docker
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # Налаштування Frontend
  - type: web
    name: frontend-service
    runtime: docker
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 5173
      - key: VITE_API_URL # Приклад, щоб фронт бачив бекенд
        fromService:
          type: web
          name: backend-service
          property: host
